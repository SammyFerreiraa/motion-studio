<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// Contrato: o filme é uma função pura do tempo. window.seek(t) pinta o quadro t, nada mais.
// Sem CSS transition, setTimeout, rAF, Math.random ou estado entre quadros.
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;      // 16:9 e 9:16 vêm daqui
const cv = document.getElementById('c');
// Resolução de saída: desenha em coordenadas lógicas W×H, o canvas tem ?res= px no lado curto (480 preview, 2160 final).
const RES = +Q.get('res') || Math.min(W, H);
const even = (x) => Math.round(x / 2) * 2;
const OW = even(W * RES / Math.min(W, H)), OH = even(H * RES / Math.min(W, H)), KX = OW / W, KY = OH / H, KS = (KX + KY) / 2;
cv.width = OW; cv.height = OH;
const g = cv.getContext('2d');
if (KS !== 1) { // blur e sombra do canvas ignoram a transformação: escalar à mão
  const P = CanvasRenderingContext2D.prototype, d = (p) => Object.getOwnPropertyDescriptor(P, p);
  for (const p of ['shadowBlur', 'shadowOffsetX', 'shadowOffsetY']) { const D = d(p); Object.defineProperty(g, p, { get: () => D.get.call(g) / KS, set: (v) => D.set.call(g, v * KS) }); }
  const F = d('filter'); Object.defineProperty(g, 'filter', { get: () => F.get.call(g), set: (v) => F.set.call(g, String(v).replace(/blur\(([\d.]+)px\)/g, (_, n) => `blur(${(n * KS).toFixed(2)}px)`)) });
}
const U = Math.min(W, H) / 1080;                              // escala única, layout por orientação em L
const PORTRAIT = H > W;

const BPM = 120, B = 60 / BPM;
window.DURATION = 32 * B;                                     // 16 s: 8 compassos
window.READY = Promise.all([
  // document.fonts.load('600 40px "Marca"'),  // fontes reais da marca (assets/), carregue aqui
]);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mulberry32 = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// Resposta ao degrau de uma mola amortecida. z=0.82 → ~1% de rebote. w maior = mais rápido.
function step(dt, z = 0.82, w = 14) {
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
// Um valor com vários alvos = soma de uma mola por mudança (forma fechada, sem estado).
function sv(t, start, changes, z, w) {
  let v = start, prev = start;
  for (const c of changes) { v += (c.to - prev) * step(t - c.t, z, w); prev = c.to; }
  return v;
}

// ---------- Estados na grade de batidas (a tabela aprovada vira isto) ----------
// w/h/r em unidades de 1080; cx/cy = centro; cur = posição do cursor relativa ao centro do contêiner.
const S = PORTRAIT ? [
  { t: 0 * B,  w: 420, h: 130, r: 65,  fill: [28, 26, 24],   ink: [239, 233, 225], label: 'Havly',        cur: [0, 40] },
  { t: 8 * B,  w: 860, h: 520, r: 36,  fill: [255, 255, 255], ink: [28, 26, 24],   label: 'Criar conta',  cur: [120, 120] },
  { t: 16 * B, w: 560, h: 150, r: 75,  fill: [228, 87, 46],   ink: [255, 255, 255], label: 'Tudo pronto',  cur: [0, 30] },
  { t: 28 * B, w: 420, h: 130, r: 65,  fill: [28, 26, 24],   ink: [239, 233, 225], label: 'Havly',        cur: [0, 40] },
] : [
  { t: 0 * B,  w: 420, h: 130, r: 65,  fill: [28, 26, 24],   ink: [239, 233, 225], label: 'Havly',        cur: [0, 40] },
  { t: 8 * B,  w: 980, h: 480, r: 36,  fill: [255, 255, 255], ink: [28, 26, 24],   label: 'Criar conta',  cur: [160, 110] },
  { t: 16 * B, w: 620, h: 150, r: 75,  fill: [228, 87, 46],   ink: [255, 255, 255], label: 'Tudo pronto',  cur: [0, 30] },
  { t: 28 * B, w: 420, h: 130, r: 65,  fill: [28, 26, 24],   ink: [239, 233, 225], label: 'Havly',        cur: [0, 40] },
];
const prop = (k, i) => ({ start: Array.isArray(S[0][k]) ? S[0][k][i] : S[0][k], ch: S.map((s) => ({ t: s.t, to: Array.isArray(s[k]) ? s[k][i] : s[k] })) });
const val = (t, k, i) => { const p = prop(k, i); return sv(t, p.start, p.ch); };
const rgb = (t, k) => `rgb(${[0, 1, 2].map((i) => Math.round(clamp(val(t, k, i), 0, 255))).join(',')})`;

function draw(t) {
  g.setTransform(KX, 0, 0, KY, 0, 0);
  g.fillStyle = '#efe9e1'; g.fillRect(0, 0, W, H);          // fundo neutro e quente, um acento
  const cx = W / 2, cy = H / 2;
  const w = val(t, 'w') * U, h = val(t, 'h') * U, r = Math.min(val(t, 'r') * U, h / 2);
  g.fillStyle = rgb(t, 'fill');
  g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, r); g.fill();

  // conteúdo troca atrás de um desfoque curto: entra depois que a transformação começa, sai antes da próxima
  S.forEach((s, i) => {
    const nx = S[i + 1];
    const a = clamp((t - (s.t + 0.12)) / 0.22);
    const o = nx ? clamp((t - (nx.t - 0.05)) / 0.2) : 0;
    const alpha = a * (1 - o), blur = 12 * U * ((1 - a) + o);
    if (alpha <= 0.01) return;
    g.save(); g.globalAlpha = alpha; g.filter = `blur(${blur.toFixed(1)}px)`;
    g.fillStyle = `rgb(${s.ink.join(',')})`; g.font = `600 ${52 * U}px system-ui, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s.label, cx, cy);
    g.restore();
  });

  // cursor conduz cada mudança e "clica" um pouco antes dela
  const kx = { start: S[0].cur[0], ch: S.map((s) => ({ t: s.t - 0.35, to: s.cur[0] })) };
  const ky = { start: S[0].cur[1], ch: S.map((s) => ({ t: s.t - 0.35, to: s.cur[1] })) };
  const mx = cx + sv(t, kx.start, kx.ch, 0.9, 11) * U + (w / 2) * 0.0, my = cy + sv(t, ky.start, ky.ch, 0.9, 11) * U;
  const press = S.reduce((m, s) => Math.max(m, Math.exp(-(((t - (s.t - 0.1)) / 0.07) ** 2))), 0);
  const k = (1 - 0.18 * press) * U;
  g.save(); g.translate(mx, my); g.scale(k, k);
  g.fillStyle = '#111'; g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 30); g.lineTo(8, 23); g.lineTo(14, 36); g.lineTo(19, 34); g.lineTo(13, 21); g.lineTo(23, 21); g.closePath();
  g.stroke(); g.fill(); g.restore();
}
window.seek = (t) => draw(clamp(t, 0, window.DURATION));
draw(0);
</script>
